<html>
<head>
<title>Chemistry - Visual Science Mind Labs</title>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
padding:15px;
background:#0f172a;
}

.navbar a{
color:white;
margin:10px;
text-decoration:none;
}

/* TITLE */

h1{
text-align:center;
margin-top:20px;
}

/* CARDS */

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:#0f172a;
padding:20px;
margin:15px;
border-radius:12px;
width:250px;
position:relative;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

/* HEART */

.heart{
position:absolute;
top:10px;
right:10px;
font-size:20px;
cursor:pointer;
transition:0.3s;
}

.heart:hover{
color:red;
transform:scale(1.2);
}

.card a{
color:#60a5fa;
text-decoration:none;

  canvas{
background:black;
border-radius:8px;
margin-top:10px;
  }
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<h2>Visual Science Mind Labs</h2>

<div>
<a href="index.html">Home</a>
<a href="physics.html">Physics</a>
<a href="math.html">Math</a>
<a href="chemistry.html">Chemistry</a>
</div>

</div>

<h1>🧪 Chemistry Tools</h1>

<div class="container">

<!-- CHEMICAL BONDING CARD -->

<div class="card" style="position:relative;">

<span class="heart" onclick="likeSim('Chemical Bonding','bonding.html', this)">♡</span>

<h3 data-name="Chemical Bonding">⚛ Chemical Bonding</h3>

<canvas id="bondPreview" width="250" height="150"></canvas>

<br>
<a href="bonding.html">Open</a>

</div>

</div>

<!-- SCRIPTS -->

<script>

function likeSim(name,link,el){

let liked = JSON.parse(localStorage.getItem("liked")) || []

if(!liked.some(item=>item.name===name)){

liked.push({name:name,link:link})
localStorage.setItem("liked", JSON.stringify(liked))

el.innerText="❤️"

}else{

liked = liked.filter(item=>item.name!==name)
localStorage.setItem("liked", JSON.stringify(liked))

el.innerText="♡"

}

}

</script>

<script>

let liked = JSON.parse(localStorage.getItem("liked")) || []

document.querySelectorAll(".card").forEach(card=>{

let name = card.querySelector("h3").dataset.name
let heart = card.querySelector(".heart")

if(heart && liked.some(item=>item.name===name)){
heart.innerText="❤️"
}

})

</script>

  <script>

const canvas = document.getElementById("bondPreview")

if(canvas){

const ctx = canvas.getContext("2d")

let t = 0

function draw(){

ctx.clearRect(0,0,250,150)

// atoms
let leftX = 70
let rightX = 180
let y = 75

// draw atoms
ctx.fillStyle="blue"
ctx.beginPath()
ctx.arc(leftX,y,20,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="green"
ctx.beginPath()
ctx.arc(rightX,y,20,0,Math.PI*2)
ctx.fill()

// electron moving (shared style)
let ex = (leftX + rightX)/2 + Math.sin(t)*25
let ey = y

ctx.fillStyle="yellow"
ctx.beginPath()
ctx.arc(ex,ey,4,0,Math.PI*2)
ctx.fill()

// label
ctx.fillStyle="white"
ctx.font="12px Arial"
ctx.fillText("Bonding Preview", 70, 20)

t += 0.05

requestAnimationFrame(draw)

}

draw()

}

  </script>
  

</body>
</html>
