<!DOCTYPE html>
<html>

<head>

<title>Mirror Ray Diagram Simulator</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
text-align:center;
overflow:hidden;
}

#bg{
position:fixed;
top:0;
left:0;
z-index:-1;
}

canvas{
border:2px solid white;
background:rgba(0,0,0,0.6);
margin-top:20px;
}

.controls{
margin-top:15px;
}

button{
padding:8px 14px;
margin:5px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

input{
width:300px;
}

.info{
margin-top:10px;
font-size:18px;
}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<h1>Mirror Ray Diagram Simulator</h1>

<div class="controls">

<button onclick="setMirror('concave')">Concave Mirror</button>
<button onclick="setMirror('convex')">Convex Mirror</button>

<br><br>

Object Distance

<br>

<input type="range" min="80" max="500" value="250" id="obj" oninput="draw()">

</div>

<div class="info" id="caseText"></div>

<canvas id="sim" width="900" height="420"></canvas>

<script>

/* -------- animated background -------- */

let bg=document.getElementById("bg");
let bgc=bg.getContext("2d");

bg.width=window.innerWidth;
bg.height=window.innerHeight;

let stars=[];

for(let i=0;i<120;i++){

stars.push({
x:Math.random()*bg.width,
y:Math.random()*bg.height,
r:Math.random()*2,
v:Math.random()*0.5
})

}

function animateBG(){

bgc.clearRect(0,0,bg.width,bg.height)

bgc.fillStyle="white"

stars.forEach(s=>{

bgc.beginPath()
bgc.arc(s.x,s.y,s.r,0,Math.PI*2)
bgc.fill()

s.y+=s.v

if(s.y>bg.height) s.y=0

})

requestAnimationFrame(animateBG)

}

animateBG()

/* -------- physics simulator -------- */

let mirrorType="concave"

function setMirror(t){
mirrorType=t
draw()
}

function draw(){

let canvas=document.getElementById("sim")
let ctx=canvas.getContext("2d")

ctx.clearRect(0,0,900,420)

let axisY=220
let mirrorX=650

let objX=parseInt(document.getElementById("obj").value)

let objHeight=70

let focal=120
let center=240

/* principal axis */

ctx.strokeStyle="white"

ctx.beginPath()
ctx.moveTo(0,axisY)
ctx.lineTo(900,axisY)
ctx.stroke()

ctx.fillText("Principal Axis",10,axisY-5)

/* curved mirror */

ctx.strokeStyle="white"
ctx.beginPath()

if(mirrorType==="concave"){

ctx.arc(mirrorX+80,axisY,200,Math.PI*0.65,Math.PI*1.35)

}else{

ctx.arc(mirrorX-80,axisY,200,-Math.PI*0.35,Math.PI*0.35)

}

ctx.stroke()

/* pole */

let P=mirrorX

ctx.fillStyle="cyan"

ctx.beginPath()
ctx.arc(P,axisY,5,0,Math.PI*2)
ctx.fill()

ctx.fillText("P",P-5,axisY+18)

/* focal and center */

let F = mirrorType==="concave" ? mirrorX-focal : mirrorX+focal
let C = mirrorType==="concave" ? mirrorX-center : mirrorX+center

ctx.beginPath()
ctx.arc(F,axisY,5,0,Math.PI*2)
ctx.fill()
ctx.fillText("F",F-5,axisY+18)

ctx.beginPath()
ctx.arc(C,axisY,5,0,Math.PI*2)
ctx.fill()
ctx.fillText("C",C-5,axisY+18)

/* object */

ctx.strokeStyle="yellow"

ctx.beginPath()
ctx.moveTo(objX,axisY)
ctx.lineTo(objX,axisY-objHeight)
ctx.stroke()

ctx.fillText("Object (O)",objX-25,axisY-objHeight-10)

/* mirror formula */

let u=mirrorX-objX
let f=mirrorType==="concave" ? -focal : focal

let v=1/((1/f)-(1/u))

let imageX=mirrorX-v
let imageHeight=-(v/u)*objHeight

/* image */

ctx.strokeStyle="lime"

ctx.beginPath()
ctx.moveTo(imageX,axisY)
ctx.lineTo(imageX,axisY-imageHeight)
ctx.stroke()

ctx.fillText("Image (I)",imageX-20,axisY-imageHeight-10)

/* rays */

ctx.strokeStyle="red"

/* ray parallel */

ctx.beginPath()
ctx.moveTo(objX,axisY-objHeight)
ctx.lineTo(mirrorX,axisY-objHeight)
ctx.stroke()

ctx.beginPath()
ctx.moveTo(mirrorX,axisY-objHeight)
ctx.lineTo(F,axisY)
ctx.stroke()

/* ray through F */

ctx.beginPath()
ctx.moveTo(objX,axisY-objHeight)
ctx.lineTo(F,axisY)
ctx.stroke()

ctx.beginPath()
ctx.moveTo(mirrorX,axisY-objHeight)
ctx.lineTo(mirrorX-300,axisY-objHeight)
ctx.stroke()

/* ray through C */

ctx.strokeStyle="orange"

ctx.beginPath()
ctx.moveTo(objX,axisY-objHeight)
ctx.lineTo(C,axisY)
ctx.lineTo(mirrorX,axisY-objHeight)
ctx.stroke()

/* magnification */

let m = -v/u

document.getElementById("caseText").innerHTML =
"Magnification: "+m.toFixed(2)

}

draw()

</script>

</body>

</html>
