<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TON 618 | Final Singularity Lab</title>
    <style>
        :root {
            --horizon: #000;
            --plasma: #fb923c;
            --plasma-glow: #ea580c;
            --space: #020617;
            --obj: #38bdf8;
            --img: #f43f5e;
            --ray-p: #facc15;
            --ray-pole: #10b981;
            --ray-c: #a855f7;
        }

        body {
            margin: 0;
            background-color: var(--space);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- THE ANIMATED BLACK HOLE --- */
        .bh-viewport {
            position: absolute;
            width: 100%; height: 100%;
            z-index: -1;
            display: flex; justify-content: center; align-items: center;
            left: 30%; 
        }

        .accretion-disk {
            position: absolute;
            width: 800px; height: 800px;
            background: conic-gradient(from 0deg, transparent, var(--plasma), #fff, var(--plasma-glow), transparent);
            border-radius: 50%;
            filter: blur(50px);
            animation: rotateDisk 6s infinite linear;
            opacity: 0.4;
        }

        .photon-sphere {
            position: absolute;
            width: 250px; height: 250px;
            border-radius: 50%;
            box-shadow: 0 0 80px 20px var(--plasma-glow), inset 0 0 50px #fff;
            animation: pulse 4s infinite ease-in-out;
        }

        .event-horizon {
            position: absolute;
            width: 180px; height: 180px;
            background: var(--horizon);
            border-radius: 50%;
            z-index: 2;
        }

        @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

        /* --- UI PANEL --- */
        #ui {
            width: 320px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(25px);
            padding: 30px;
            border-right: 1px solid rgba(251, 146, 60, 0.4);
            display: flex; flex-direction: column; gap: 20px;
            z-index: 10;
        }

        .card { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { margin: 0; font-size: 1.2rem; color: var(--plasma); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--plasma-glow); }
        
        .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button {
            padding: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8;
            border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 11px;
        }
        button.active { background: var(--plasma); color: #000; border-color: var(--plasma); box-shadow: 0 0 15px var(--plasma-glow); }

        input[type=range] { width: 100%; accent-color: var(--plasma); margin-top: 10px; }
        .stats { font-family: monospace; font-size: 12px; line-height: 1.8; margin-top: 10px; }
        .stats b { color: var(--plasma); }

        canvas { flex-grow: 1; }
    </style>
</head>
<body>

<div class="bh-viewport">
    <div class="accretion-disk"></div>
    <div class="photon-sphere"></div>
    <div class="event-horizon"></div>
</div>

<div id="ui">
    <h1>Singularity Lab</h1>
    
    <div class="card">
        <label style="font-size: 9px; color: #64748b;">CALIBRATE MIRROR</label>
        <div class="toggle-grid">
            <button onclick="setMode('concave')" id="btn-concave" class="active">CONCAVE</button>
            <button onclick="setMode('convex')" id="btn-convex">CONVEX</button>
        </div>
    </div>

    <div class="card">
        <label style="font-size: 9px; color: #64748b;">POSITION (u)</label>
        <input type="range" id="u-slider" min="30" max="600" value="400">
    </div>

    <div class="card stats">
        Optics: <b id="out-type">-</b><br>
        Nature: <b id="out-nature">-</b><br>
        Magnification: <b id="out-m">0</b>x
    </div>

    <div class="card stats" style="color: #64748b; font-size: 10px;">
        <span style="color: var(--ray-p)">■</span> Rule 1: Parallel & F<br>
        <span style="color: var(--ray-pole)">■</span> Rule 4: Incident at P<br>
        <span style="color: var(--ray-c)">■</span> Rule 3: Pass through C
    </div>
</div>

<canvas id="stage"></canvas>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const uSlider = document.getElementById('u-slider');

    let state = { mode: 'concave', f: 160, objH: 80 };

    function setMode(m) {
        state.mode = m;
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+m).classList.add('active');
    }

    function init() {
        canvas.width = window.innerWidth - 320;
        canvas.height = window.innerHeight;
    }
    window.onresize = init;
    init();

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const u = parseInt(uSlider.value);
        const Px = canvas.width * 0.7; 
        const Py = canvas.height / 2;

        // PHYSICS - FIXED SIGN CONVENTIONS
        const u_cart = -u; 
        // Concave: f is negative | Convex: f is positive
        const f_cart = state.mode === 'concave' ? -state.f : state.f;
        const v_cart = 1 / ((1/f_cart) - (1/u_cart));
        const m = -v_cart / u_cart;

        document.getElementById('out-type').innerText = state.mode.toUpperCase();
        document.getElementById('out-m').innerText = Math.abs(m).toFixed(2);
        document.getElementById('out-nature').innerText = (v_cart < 0) ? "Real & Inverted" : "Virtual & Erect";

        // Draw Principal Axis
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.moveTo(0, Py); ctx.lineTo(canvas.width, Py); ctx.stroke();

        // Standard Points
        const s = state.mode === 'concave' ? -1 : 1;
        const Fx = Px + state.f * s;
        const Cx = Px + state.f * 2 * s;
        drawDot(Fx, Py, 'F');
        drawDot(Cx, Py, 'C');

        // MIRROR DRAWING (FIXED SWAP)
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
        ctx.beginPath();
        for(let i = -200; i <= 200; i++) {
            // CONCAVE should be ')' (ends toward object). CONVEX should be '(' (ends away from object).
            // Logic: Object is at Px-u. If Concave ends are at Px-xOff, they move toward object.
            const xOff = (i * i) / (4 * (state.f * 2)) * (state.mode === 'concave' ? -1 : 1);
            i === -200 ? ctx.moveTo(Px + xOff, Py + i) : ctx.lineTo(Px + xOff, Py + i);
        }
        ctx.stroke();

        const objX = Px - u;
        const imgX = Px + v_cart;
        const imgH = state.objH * m; 
        const oTipY = Py - state.objH;
        const iTipY = Py - imgH;

        // Render Entities
        drawArrow(objX, Py, state.objH, 'var(--obj)', 'OBJECT');
        if(Math.abs(v_cart) < 4000) {
            drawArrow(imgX, Py, imgH, 'var(--img)', 'IMAGE', v_cart > 0);
        }

        // --- THE 3 MASTER RAYS ---
        // 1. Parallel -> Mirror -> Focus
        traceRay(objX, oTipY, Px, oTipY, imgX, iTipY, 'var(--ray-p)', v_cart > 0);
        
        // 2. Incident to Pole (Px, Py)
        traceRay(objX, oTipY, Px, Py, imgX, iTipY, 'var(--ray-pole)', v_cart > 0);

        // 3. Center of Curvature (Cx, Py) -> Reflects back
        const slopeC = (Py - oTipY) / (Cx - objX);
        const hitYC = oTipY + slopeC * (Px - objX);
        traceRay(objX, oTipY, Px, hitYC, imgX, iTipY, 'var(--ray-c)', v_cart > 0);

        requestAnimationFrame(draw);
    }

    function traceRay(x1, y1, hitX, hitY, imgX, imgY, color, isVirtual) {
        // Incident Ray (Solid White)
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(hitX, hitY); ctx.stroke();

        // Reflected Ray (Colored Glowing)
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue(color.replace('var(','').replace(')',''));
        ctx.beginPath();
        if(isVirtual) {
            // Dashed trace behind mirror
            ctx.setLineDash([5, 5]); ctx.moveTo(hitX, hitY); ctx.lineTo(imgX, imgY); ctx.stroke();
            // Solid reflection into real space
            ctx.setLineDash([]); ctx.moveTo(hitX, hitY);
            const dx = hitX - imgX; const dy = hitY - imgY;
            ctx.lineTo(hitX + dx*10, hitY + dy*10);
        } else {
            // Pass through real image
            ctx.moveTo(hitX, hitY);
            ctx.lineTo(hitX + (imgX-hitX)*10, hitY + (imgY-hitY)*10);
        }
        ctx.stroke();
    }

    function drawArrow(x, y, h, colorVar, label, isVirtual) {
        ctx.save();
        if(isVirtual) ctx.globalAlpha = 0.5;
        const color = getComputedStyle(document.documentElement).getPropertyValue(colorVar.replace('var(','').replace(')',''));
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.stroke();
        const head = h > 0 ? 10 : -10;
        ctx.beginPath(); ctx.moveTo(x-6, y-h+head); ctx.lineTo(x, y-h); ctx.lineTo(x+6, y-h+head); ctx.fill();
        ctx.font = "bold 11px sans-serif"; ctx.fillText(label, x-20, y + (h>0?25:-h-15));
        ctx.restore();
    }

    function drawDot(x, y, t) {
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
        ctx.font = "bold 11px sans-serif"; ctx.fillText(t, x-4, y+22);
    }

    draw();
</script>

    <script>

let views = JSON.parse(localStorage.getItem("views")) || {}

views["Mirror Simulator"] = (views["Mirror Simulator"] || 0) + 1

localStorage.setItem("views", JSON.stringify(views))

    </script>
    
</body>
</html>
