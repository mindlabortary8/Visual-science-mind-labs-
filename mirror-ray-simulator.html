<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Mirror Lab | Ray Diagrams</title>
    <style>
        :root { --bg: #020617; --accent: #60a5fa; --glass: rgba(30, 41, 59, 0.8); }
        body { margin: 0; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        
        #ui { position: absolute; top: 20px; left: 20px; background: var(--glass); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); width: 300px; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .slider-container { margin: 20px 0; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #334155; color: #94a3b8; cursor: pointer; transition: 0.3s; font-weight: 600; }
        button.active { background: var(--accent); color: white; box-shadow: 0 0 15px rgba(96, 165, 250, 0.4); }

        .stats { font-family: monospace; font-size: 13px; color: #94a3b8; line-height: 1.6; }
        .stats b { color: var(--accent); }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h2 style="margin-top:0; font-size: 1.2rem;">Optics Engine</h2>
    
    <div class="btn-group">
        <button onclick="setMode('concave')" id="btn-concave" class="active">Concave</button>
        <button onclick="setMode('convex')" id="btn-convex">Convex</button>
        <button onclick="setMode('plane')" id="btn-plane">Plane</button>
    </div>

    <div class="slider-container">
        <label style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Object Position (u)</label>
        <input type="range" id="uRange" min="10" max="600" value="300">
    </div>

    <div class="stats" id="info">
        Case: <b>Loading...</b><br>
        Image: <b>Calculating...</b>
    </div>
</div>

<canvas id="opticsCanvas"></canvas>

<script>
const canvas = document.getElementById('opticsCanvas');
const ctx = canvas.getContext('2d');
const uSlider = document.getElementById('uRange');

let mode = 'concave';
const f = 120; // Focal length
const c = 240; // Center of curvature
let u = 300;   // Object distance

function setMode(m) {
    mode = m;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + m).classList.add('active');
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    u = parseInt(uSlider.value);
    
    const midX = canvas.width * 0.7; // Mirror position
    const midY = canvas.height / 2;
    const objH = 80; // Object height
    const objX = midX - u;

    // 1. Draw Principal Axis
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(canvas.width, midY); ctx.stroke();

    // 2. Draw Focal Points
    if (mode !== 'plane') {
        const fDir = mode === 'concave' ? -1 : 1;
        drawPoint(midX + (f * fDir), midY, 'F');
        drawPoint(midX + (c * fDir), midY, 'C');
    }

    // 3. Draw Mirror
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath();
    if (mode === 'plane') {
        ctx.moveTo(midX, midY - 150); ctx.lineTo(midX, midY + 150);
    } else {
        const arcDir = mode === 'concave' ? 0 : 1;
        ctx.arc(midX + (c * (mode === 'concave' ? -1 : 1)), midY, c, 
                arcDir * Math.PI - 0.5, arcDir * Math.PI + 0.5);
    }
    ctx.stroke();

    // 4. Calculate Image Position (Lens/Mirror Equation: 1/v + 1/u = 1/f)
    // For mirrors, f is negative for concave in this coordinate system
    let v, vH, caseText, typeText;
    
    if (mode === 'plane') {
        v = u; vH = objH;
        caseText = "Plane Reflection";
        typeText = "Virtual, Erect, Same Size";
    } else {
        const focal = mode === 'concave' ? -f : f;
        const distU = -u; 
        v = 1 / ((1/focal) - (1/distU));
        const mag = -v / distU;
        vH = objH * mag;

        // Logic for cases
        if (mode === 'concave') {
            if (u > c) caseText = "Beyond C";
            else if (u === c) caseText = "At C";
            else if (u > f) caseText = "Between C and F";
            else if (u === f) caseText = "At F (Infinity)";
            else caseText = "Between F and P";
        } else {
            caseText = "Convex Mirror";
        }
        typeText = `${Math.abs(vH) > objH ? 'Magnified' : 'Diminished'}, ${vH > 0 ? 'Inverted' : 'Erect'}`;
    }

    document.getElementById('info').innerHTML = `Case: <b>${caseText}</b><br>Nature: <b>${typeText}</b>`;

    // 5. Draw Object
    drawArrow(objX, midY, objH, '#60a5fa', 'Object');

    // 6. Draw Rays (The Tricky Part)
    ctx.lineWidth = 1.5;
    
    // Ray 1: Parallel then through F
    ctx.strokeStyle = '#fbbf24'; 
    ctx.beginPath();
    ctx.moveTo(objX, midY - objH);
    ctx.lineTo(midX, midY - objH); // Incident
    if (mode === 'concave') {
        ctx.lineTo(midX + v, midY + vH); // Reflected through image tip
    } else if (mode === 'convex') {
        ctx.lineTo(midX + 500, midY - objH + (500 * (objH/(f)))); // Diverging
    } else {
        ctx.lineTo(objX, midY + objH);
    }
    ctx.stroke();

    // Ray 2: Center of curvature / Pole
    ctx.strokeStyle = '#f87171';
    ctx.beginPath();
    ctx.moveTo(objX, midY - objH);
    ctx.lineTo(midX, midY); // To Pole
    ctx.lineTo(midX - (mode === 'plane' ? u : 800), midY + (mode === 'plane' ? objH : 800 * (vH/v)));
    ctx.stroke();

    // 7. Draw Image
    if (Math.abs(v) < 2000) {
        const imgX = midX + v;
        drawArrow(imgX, midY, -vH, '#f87171', 'Image', true);
    }

    requestAnimationFrame(draw);
}

function drawArrow(x, y, h, color, label, isDash = false) {
    ctx.save();
    if(isDash) ctx.setLineDash([5, 5]);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - h);
    ctx.stroke();
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(x - 5, y - h + (h > 0 ? 10 : -10));
    ctx.lineTo(x, y - h);
    ctx.lineTo(x + 5, y - h + (h > 0 ? 10 : -10));
    ctx.fill();
    ctx.fillText(label, x - 20, y + (h > 0 ? 20 : -h + 20));
    ctx.restore();
}

function drawPoint(x, y, label) {
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillText(label, x - 5, y + 20);
}

draw();
</script>
</body>
</html>
