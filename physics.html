  <script>

function likeSim(name,link,el){

let liked = JSON.parse(localStorage.getItem("liked")) || []

if(!liked.some(item=>item.name===name)){

liked.push({name:name,link:link})
localStorage.setItem("liked", JSON.stringify(liked))

el.innerText="❤️"

}else{

liked = liked.filter(item=>item.name!==name)
localStorage.setItem("liked", JSON.stringify(liked))

el.innerText="♡"

}

}

  </script>
  <script>

let liked = JSON.parse(localStorage.getItem("liked")) || []

document.querySelectorAll(".heart").forEach(heart=>{

let name = heart.parentElement.querySelector("h3").innerText

if(liked.some(item=>item.name===name)){
heart.innerText="❤️"
}

})

  </script>

  <script>

const canvas = document.getElementById("mirrorPreview")

if(canvas){

const ctx = canvas.getContext("2d")

let t = 0

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

// mirror (vertical line)
ctx.strokeStyle="white"
ctx.beginPath()
ctx.moveTo(200,0)
ctx.lineTo(200,150)
ctx.stroke()

// moving object
let objX = 50 + Math.sin(t)*20
let objY = 75

// object
ctx.fillStyle="yellow"
ctx.beginPath()
ctx.arc(objX,objY,5,0,Math.PI*2)
ctx.fill()

// incident ray
ctx.strokeStyle="cyan"
ctx.beginPath()
ctx.moveTo(objX,objY)
ctx.lineTo(200,objY)
ctx.stroke()

// reflected ray
ctx.strokeStyle="red"
ctx.beginPath()
ctx.moveTo(200,objY)
ctx.lineTo(250, objY - (objX-50))
ctx.stroke()

t += 0.05

requestAnimationFrame(draw)

}

draw()

}

  </script>

  <script>

const fCanvas = document.getElementById("formulaPreview")

if(fCanvas){

const ctx = fCanvas.getContext("2d")

let t = 0

function drawFormula(){

ctx.clearRect(0,0,fCanvas.width,fCanvas.height)

// generate changing values
let u = -50 + Math.sin(t)*20
let f = -30
let v = 1 / (1/f - 1/u)

// text styling
ctx.fillStyle="white"
ctx.font="14px Arial"

// formula
ctx.fillText("1/f = 1/v + 1/u", 50, 30)

// values
ctx.fillText("u = " + u.toFixed(1), 20, 80)
ctx.fillText("v = " + v.toFixed(1), 140, 80)
ctx.fillText("f = " + f, 90, 110)

t += 0.05

requestAnimationFrame(drawFormula)

}

drawFormula()

}

  </script>
